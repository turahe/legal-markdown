[project]
name = "pdf-markdown"
version = "0.1.0"
description = "Convert Indonesian legal and regulatory PDFs into clean, structured Markdown"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nur Wachid", email = "wachid@outlook.com" }
]
requires-python = ">=3.14"
keywords = ["pdf", "markdown", "markitdown", "indonesia", "peraturan", "legal"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markitdown[all,az-content-understanding]>=0.1.8",
    "openai>=3.29.0",
]

[project.scripts]
pdf-markdown = "pdf_markdown:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
